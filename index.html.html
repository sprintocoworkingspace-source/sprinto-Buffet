<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام بوفيه مساحة العمل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: var(--text-main);
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            outline: none;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        textarea {
            resize: vertical;
            min-height: 55px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .counter-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter-btn {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .counter-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .counter-container input {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        /* أزرار اختيار حالة الدفع */
        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .payment-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .payment-options input[type="radio"] {
            display: none;
        }

        .payment-options input[type="radio"]:checked + .payment-label.paid {
            border-color: var(--success-color);
            background-color: #ecfdf5;
            color: #065f46;
        }

        .payment-options input[type="radio"]:checked + .payment-label.unpaid {
            border-color: var(--danger-color);
            background-color: #fef2f2;
            color: #991b1b;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button[type="submit"]:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            transform: none;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 15px;
            font-weight: 600;
            min-height: 24px;
        }

        .success { color: var(--success-color); }
        .error { color: var(--danger-color); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>☕ طلبات البوفيه</h2>
            <p>اختر الصنف وسجل الطلب بسرعة</p>
        </div>

        <form id="buffetForm">
            <div class="form-group">
                <label for="itemName">اختر الصنف</label>
                <select id="itemName" required>
                    <option value="" disabled selected>-- اضغط للاختيار --</option>
                    <option value="مياه">مياه</option>
                    <option value="سناكس">سناكس</option>
                    <option value="نسكافيه">نسكافيه</option>
                    <option value="شاي باكت">شاي باكت</option>
                    <option value="شاي سايب">شاي سايب</option>
                    <option value="قهوه باكت">قهوه باكت</option>
                    <option value="قهوه سايب">قهوه سايب</option>
                    <option value="حلويات">حلويات</option>
                    <option value="كولا">كولا</option>
                    <option value="عصير">عصير</option>
                    <option value="اندومي">اندومي</option>
                    <option value="اضافت باكت اندومي">اضافت باكت اندومي</option>
                    <option value="اضافت بكت نسكافيه">اضافت بكت نسكافيه</option>
                    <option value="اضافت باكت قهوه">اضافت باكت قهوه</option>
                </select>
            </div>

            <div class="form-group">
                <label for="itemPrice">سعر الصنف (جنيه)</label>
                <input type="number" id="itemPrice" step="0.5" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="itemQuantity">العدد</label>
                <div class="counter-container">
                    <button type="button" class="counter-btn" onclick="decreaseQty()">-</button>
                    <input type="number" id="itemQuantity" min="1" value="1" required>
                    <button type="button" class="counter-btn" onclick="increaseQty()">+</button>
                </div>
            </div>

            <!-- خيار حالة الدفع -->
            <div class="form-group">
                <label>حالة الدفع</label>
                <div class="payment-options">
                    <div>
                        <input type="radio" id="paid" name="paymentStatus" value="مدفوع" checked>
                        <label for="paid" class="payment-label paid">✅ مدفوع</label>
                    </div>
                    <div>
                        <input type="radio" id="unpaid" name="paymentStatus" value="غير مدفوع">
                        <label for="unpaid" class="payment-label unpaid">⏳ آجل / غير مدفوع</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="itemNotes">ملاحظات الطلب (اختياري)</label>
                <textarea id="itemNotes" placeholder="مثال: سكر خفيف، طاولة 2، اسم العميل..."></textarea>
            </div>

            <button type="submit" id="submitBtn">تسجيل الطلب</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // الرابط الجديد الخاص بك
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx088K4MABMD3UWLiSN09R8I03kSQ-K-9-76h_w9GaN_C2OUWlqL0CGCIuuocRUK3v9/exec';

        function increaseQty() {
            const qtyInput = document.getElementById('itemQuantity');
            qtyInput.value = parseInt(qtyInput.value) + 1;
        }

        function decreaseQty() {
            const qtyInput = document.getElementById('itemQuantity');
            let currentValue = parseInt(qtyInput.value);
            if (currentValue > 1) {
                qtyInput.value = currentValue - 1;
            }
        }

        const form = document.getElementById('buffetForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التسجيل...';
            statusDiv.textContent = '';

            const selectedPayment = document.querySelector('input[name="paymentStatus"]:checked').value;

            const payload = {
                itemName: document.getElementById('itemName').value,
                itemPrice: document.getElementById('itemPrice').value,
                itemQuantity: document.getElementById('itemQuantity').value,
                paymentStatus: selectedPayment,
                itemNotes: document.getElementById('itemNotes').value.trim()
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
            .then(function() {
                statusDiv.className = 'success';
                statusDiv.textContent = '✨ تم تسجيل الطلب بنجاح!';
                form.reset();
                document.getElementById('itemQuantity').value = '1';
                document.getElementById('paid').checked = true;
            })
            .catch(function(err) {
                statusDiv.className = 'error';
                statusDiv.textContent = '❌ تعذر الاتصال، تأكد من الإنترنت.';
            })
            .finally(function() {
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل الطلب';
                setTimeout(function() {
                    statusDiv.textContent = '';
                }, 4000);
            });
        });
    </script>
</body>
</html>
