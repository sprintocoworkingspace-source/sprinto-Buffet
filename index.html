<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام بوفيه مساحة العمل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: var(--text-main);
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            outline: none;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        textarea {
            resize: vertical;
            min-height: 55px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .counter-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter-btn {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .counter-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .counter-container input {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .payment-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .payment-options input[type="radio"] {
            display: none;
        }

        .payment-options input[type="radio"]:checked + .payment-label.paid {
            border-color: var(--success-color);
            background-color: #ecfdf5;
            color: #065f46;
        }

        .payment-options input[type="radio"]:checked + .payment-label.unpaid {
            border-color: var(--danger-color);
            background-color: #fef2f2;
            color: #991b1b;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button[type="submit"]:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            transform: none;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 15px;
            font-weight: 600;
            min-height: 24px;
        }

        .success { color: var(--success-color); }
        .error { color: var(--danger-color); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>☕ تسجيل المبيعات و المأكولات</h2>
            <p>اختر الصنف وسجل الطلب بسرعة</p>
        </div>

        <form id="buffetForm">
            <div class="form-group">
                <label for="itemName">اختر الصنف</label>
                <select id="itemName" onchange="updatePrice()" required>
                    <option value="" data-price="" disabled selected>-- اضغط للاختيار --</option>
                    
                    <optgroup label="--- مشروبات ومأكولات ---">
                        <option value="مياه ص" data-price="7">مياه ص</option>
                        <option value="مياه ك" data-price="12">مياه ك</option>
                        <option value="اندومي ك" data-price="20">اندومي ك</option>
                        <option value="اندومي ص" data-price="15">اندومي ص</option>
                        <option value="كولا 10" data-price="10">كولا 10</option>
                        <option value="كولا 12" data-price="12">كولا 12</option>
                        <option value="كولا 15" data-price="15">كولا 15</option>
                        <option value="كولا 20" data-price="20">كولا 20</option>
                        <option value="عصير 10" data-price="10">عصير 10</option>
                        <option value="عصير 12" data-price="12">عصير 12</option>
                        <option value="عصير 13" data-price="13">عصير 13</option>
                        <option value="عصير 15" data-price="15">عصير 15</option>
                        <option value="لبن" data-price="15">لبن</option>
                        <option value="سناكس 15" data-price="15">سناكس 15</option>
                        <option value="سناكس 10" data-price="10">سناكس 10</option>
                        <option value="سناكس 8" data-price="8">سناكس 8</option>
                        <option value="سناكس 7" data-price="7">سناكس 7</option>
                        <option value="سناكس 6" data-price="6">سناكس 6</option>
                        <option value="سناكس 5" data-price="5">سناكس 5</option>
                        <option value="سناكس 3" data-price="3">سناكس 3</option>
                        <option value="حلويات 10" data-price="10">حلويات 10</option>
                        <option value="حلويات 9" data-price="9">حلويات 9</option>
                        <option value="حلويات 8" data-price="8">حلويات 8</option>
                        <option value="حلويات 7" data-price="7">حلويات 7</option>
                        <option value="حلويات 6" data-price="6">حلويات 6</option>
                        <option value="حلويات 5" data-price="5">حلويات 5</option>
                        <option value="حلويات 4" data-price="4">حلويات 4</option>
                        <option value="حلويات 3" data-price="3">حلويات 3</option>
                        <option value="حلويات 2" data-price="2">حلويات 2</option>
                        <option value="حلويات 1" data-price="1">حلويات 1</option>
                        <option value="حلويات 0.5" data-price="0.5">حلويات 0.5</option>
                        <option value="نسكافيه 20" data-price="20">نسكافيه 20</option>
                        <option value="نسكافيه 15" data-price="15">نسكافيه 15</option>
                        <option value="نسكافيه 10" data-price="10">نسكافيه 10</option>
                        <option value="قهوة باكيت" data-price="20">قهوة باكيت</option>
                        <option value="قهوة سايب" data-price="20">قهوة سايب</option>
                        <option value="شاي باكيت" data-price="10">شاي باكيت</option>
                        <option value="شاي سايب" data-price="10">شاي سايب</option>
                        <option value="شاي نكهات" data-price="15">شاي نكهات</option>
                        <option value="اعشاب" data-price="10">اعشاب</option>
                    </optgroup>

                    <optgroup label="--- الإضافات و الخدمات ---">
                        <option value="اضافة قهوة سايبه" data-price="9">اضافة قهوة سايبه</option>
                        <option value="اضافة باكيت قهوة" data-price="9">اضافة باكيت قهوة</option>
                        <option value="اضافة شاي سايب" data-price="3">اضافة شاي سايب</option>
                        <option value="اضافة باكيت شاي" data-price="3">اضافة باكيت شاي</option>
                        <option value="اضافة باكيت شاي نكهات" data-price="5">اضافة باكيت شاي نكهات</option>
                        <option value="اضافة باكيت اندومي صغير" data-price="5">اضافة باكيت اندومي صغير</option>
                        <option value="اضافة باكيت اندومي كبير" data-price="10">اضافة باكيت اندومي كبير</option>
                        <option value="اضافة باكيت نسكافيه 10" data-price="10">اضافة باكيت نسكافيه 10</option>
                        <option value="اضافة باكيت نسكافيه 5" data-price="5">اضافة باكيت نسكافيه 5</option>
                        <option value="اضافة اعشاب" data-price="3">اضافة اعشاب</option>
                        <option value="مناديل" data-price="3">مناديل</option>
                        <option value="تحضير" data-price="7">تحضير</option>
                    </optgroup>

                    <optgroup label="--- أدوات مكتبية وأخرى ---">
                        <option value="قلم اشكال" data-price="25">قلم اشكال</option>
                        <option value="هايلايتر" data-price="">هايلايتر</option>
                        <option value="قلم رصاص 4" data-price="4">قلم رصاص 4</option>
                        <option value="قلم رصاص 5" data-price="5">قلم رصاص 5</option>
                        <option value="قلم رصاص 6" data-price="6">قلم رصاص 6</option>
                        <option value="قلم سنون" data-price="">قلم سنون</option>
                        <option value="سنون" data-price="">سنون</option>
                        <option value="جومه" data-price="">جومه</option>
                        <option value="برايه" data-price="">برايه</option>
                        <option value="نوت بوك" data-price="">نوت بوك</option>
                        <option value="سكتش 40 ورقه" data-price="">سكتش 40 ورقه</option>
                        <option value="سكتش 60 ورقه" data-price="">سكتش 60 ورقه</option>
                        <option value="سكتش 80 ورقه" data-price="">سكتش 80 ورقه</option>
                        <option value="سكتش 100 ورقه" data-price="">سكتش 100 ورقه</option>
                        <option value="سكتش 150 ورقه" data-price="">سكتش 150 ورقه</option>
                        <option value="كراسه 40 ورقه" data-price="">كراسه 40 ورقه</option>
                        <option value="كراسه 60 ورقه" data-price="">كراسه 60 ورقه</option>
                        <option value="كراسه 80 ورقه" data-price="">كراسه 80 ورقه</option>
                        <option value="كراسه 100 ورقه" data-price="">كراسه 100 ورقه</option>
                        <option value="ورق فيلوسكاب" data-price="">ورق فيلوسكاب</option>
                        <option value="Stickzy" data-price="">Stickzy</option>
                        <option value="Designy" data-price="">Designy</option>
                        <option value="Stickers Studio 15" data-price="15">Stickers Studio 15</option>
                        <option value="Stickers Studio 25" data-price="25">Stickers Studio 25</option>
                        <option value="Stickers Studio 50" data-price="50">Stickers Studio 50</option>
                        <option value="UP Store" data-price="">UP Store</option>
                        <option value="Khadija Medals" data-price="">Khadija Medals</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="itemPrice">سعر الصنف (جنيه)</label>
                <input type="number" id="itemPrice" step="0.5" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="itemQuantity">العدد</label>
                <div class="counter-container">
                    <button type="button" class="counter-btn" onclick="decreaseQty()">-</button>
                    <input type="number" id="itemQuantity" min="1" value="1" required>
                    <button type="button" class="counter-btn" onclick="increaseQty()">+</button>
                </div>
            </div>

            <div class="form-group">
                <label>حالة الدفع</label>
                <div class="payment-options">
                    <div>
                        <input type="radio" id="paid" name="paymentStatus" value="مدفوع" checked>
                        <label for="paid" class="payment-label paid">✅ مدفوع</label>
                    </div>
                    <div>
                        <input type="radio" id="unpaid" name="paymentStatus" value="غير مدفوع">
                        <label for="unpaid" class="payment-label unpaid">⏳ آجل / غير مدفوع</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="itemNotes">ملاحظات الطلب (اختياري)</label>
                <textarea id="itemNotes" placeholder="مثال: سكر خفيف، اسم العميل..."></textarea>
            </div>

            <button type="submit" id="submitBtn">تسجيل الطلب</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwywAAeYJen9byLwqnxugJQ260QFlnkhzN2KuMN5XsAlUbWlKQQAggHZXzJiDJSZMLI/exec';

        function updatePrice() {
            const select = document.getElementById('itemName');
            const selectedOption = select.options[select.selectedIndex];
            const price = selectedOption.getAttribute('data-price');
            
            const priceInput = document.getElementById('itemPrice');
            if (price !== null && price !== "") {
                priceInput.value = price;
            } else {
                priceInput.value = '';
            }
        }

        function increaseQty() {
            const qtyInput = document.getElementById('itemQuantity');
            qtyInput.value = parseInt(qtyInput.value) + 1;
        }

        function decreaseQty() {
            const qtyInput = document.getElementById('itemQuantity');
            let currentValue = parseInt(qtyInput.value);
            if (currentValue > 1) {
                qtyInput.value = currentValue - 1;
            }
        }

        const form = document.getElementById('buffetForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التسجيل...';
            statusDiv.textContent = '';

            const selectedPayment = document.querySelector('input[name="paymentStatus"]:checked').value;

            const payload = {
                itemName: document.getElementById('itemName').value,
                itemPrice: document.getElementById('itemPrice').value,
                itemQuantity: document.getElementById('itemQuantity').value,
                paymentStatus: selectedPayment,
                itemNotes: document.getElementById('itemNotes').value.trim()
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
            .then(function() {
                statusDiv.className = 'success';
                statusDiv.textContent = '✨ تم تسجيل الطلب بنجاح!';
                form.reset();
                document.getElementById('itemQuantity').value = '1';
                document.getElementById('paid').checked = true;
            })
            .catch(function(err) {
                statusDiv.className = 'error';
                statusDiv.textContent = '❌ تعذر الاتصال، تأكد من الإنترنت.';
            })
            .finally(function() {
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل الطلب';
                setTimeout(function() {
                    statusDiv.textContent = '';
                }, 4000);
            });
        });
    </script>
</body>
</html>
